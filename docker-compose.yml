services:
  backend:
    build:
      context: ./backend
    container_name: ccpna-cmr-backend
    restart: unless-stopped
    environment:
      CCPNA_DATA_DIR: /data
    volumes:
      - ./data:/data:ro
    expose:
      - "8000"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: ccpna-cmr-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
