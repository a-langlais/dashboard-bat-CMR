name: Sync Experimental to Hugging Face
on:
  push:
    branches: [experimental]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: experimental

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          git lfs install

          git remote add hf https://a-langlais:$HF_TOKEN@huggingface.co/spaces/a-langlais/cmr-app
          
          # Envoie la branche 'experimental' vers la branche 'main' de Hugging Face
          git push --force hf experimental:main